getElementById.desc=Returns the component in the current view whose meta.domId matches the given id, just like document.getElementById in JavaScript. Only the view the script is running in is searched; embedded views, docked views and popups are not (use getPageElementById for that). Returns None if nothing matches. Only works in Perspective scripts that run within a view, such as component events, property change scripts and message handlers.
getElementById.param.id=The domId to search for, as set in the component's meta.domId property.
getElementById.returns=The matching component, which works just like 'self' (e.g. .props.text, .custom.myValue), or None if no component in the view has that domId.
getPageElementById.desc=Returns the component on the current Perspective page whose meta.domId matches the given id. Searches the view the script is running in first, then every other view on the page (embedded views, docked views and popups). Returns None if nothing matches. Only works in Perspective scripts that run within a page.
getPageElementById.param.id=The domId to search for, as set in the component's meta.domId property.
getPageElementById.returns=The matching component, which works just like 'self', or None if nothing on the page has that domId.
